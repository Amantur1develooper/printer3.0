<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>{% block title %}Online Printer{% endblock %}</title>
  {% load static %}
  <link rel="icon" type="image/jpeg" href="{% static 'images/logo.jpg' %}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'css/style.css' %}" rel="stylesheet">
  {% block head %}{% endblock %}
</head>
<body>

<nav class="op-navbar">
  <div class="container">
    <a class="op-logo" href="/">
      <img src="{% static 'images/logo.jpg' %}" alt="Online Printer logo" class="op-logo-img">
      <div class="op-logo-text">
        <b>ONLINE</b>
        <span>PRINTER</span>
      </div>
    </a>
    <div class="op-nav-links">
      <a href="/" class="op-nav-link">
        <i class="bi bi-geo-alt"></i>
        <span class="d-none d-sm-inline ms-1">Принтеры</span>
      </a>
    </div>
  </div>
</nav>

{% if messages %}
<div class="container" style="margin-top:12px">
  {% for message in messages %}
  <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
    {{ message }}
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  {% endfor %}
</div>
{% endif %}

<main class="op-main">
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</main>

<footer class="op-footer">
  <div class="container d-flex align-items-center justify-content-center gap-2">
    <img src="{% static 'images/logo.jpg' %}" alt="" class="op-footer-logo">
    <span>Online Printer — быстро, удобно, недорого</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
