{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Online Printer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-box { width: 100%; max-width: 380px; padding: 0 16px; }
  </style>
</head>
<body>
  <div class="login-box">
    <div style="text-align:center;margin-bottom:28px">
      <img src="{% static 'images/logo.jpg' %}" alt="logo"
           style="height:52px;width:52px;object-fit:contain;border-radius:10px;background:#E8E8E8;padding:4px;margin-bottom:12px">
      <div style="font-size:18px;font-weight:800;letter-spacing:-.01em">Личный кабинет</div>
      <div style="font-size:13px;color:var(--text-3);margin-top:3px">Online Printer</div>
    </div>

    <div class="op-card">
      <div class="op-card-body">
        {% if form.errors %}
        <div class="alert alert-danger mb-3">Неверный логин или пароль</div>
        {% endif %}

        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Логин</label>
            <input type="text" name="username" class="form-control" autofocus autocomplete="username">
          </div>
          <div class="mb-4">
            <label class="form-label">Пароль</label>
            <input type="password" name="password" class="form-control" autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary w-100 btn-lg">Войти</button>
          <input type="hidden" name="next" value="{{ next }}">
        </form>
      </div>
    </div>
  </div>
</body>
</html>
